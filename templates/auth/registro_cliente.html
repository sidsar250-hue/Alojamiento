{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Cliente | SysHSENA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body class="auth-page">
  <div class="auth-card" style="max-width: 620px;">
    <div class="text-center mb-4">
      <h3 class="section-title mb-1">Crear Cuenta de Huésped</h3>
      <p class="text-muted small">Reserva hoteles, hostales y posadas turísticas en La Guajira</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'danger' }} py-2 small">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" class="row g-3">
      {% csrf_token %}
      <div class="col-md-6">
        <label class="form-label">Nombres</label>
        <input type="text" name="nombres" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Apellidos</label>
        <input type="text" name="apellidos" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Tipo Doc.</label>
        <select name="tipo_documento" class="form-select">
          <option value="CC">Cédula (CC)</option>
          <option value="CE">Extranjería (CE)</option>
          <option value="PA">Pasaporte</option>
        </select>
      </div>
      <div class="col-md-8">
        <label class="form-label">Número de Documento</label>
        <input type="text" name="documento" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Teléfono</label>
        <input type="text" name="telefono" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Nacionalidad</label>
        <input type="text" name="nacionalidad" class="form-control" value="Colombiana" required>
      </div>
      <div class="col-md-12">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Usuario (Login)</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" minlength="6" required>
      </div>
      <div class="col-12 mt-4">
        <button type="submit" class="btn btn-teal w-100 py-2">Registrarme y Continuar</button>
      </div>
    </form>

    <div class="text-center small mt-3">
      ¿Ya tienes cuenta? <a href="{% url 'login' %}" class="fw-semibold" style="color: var(--primary-teal);">Inicia sesión</a>
    </div>
  </div>
</body>
</html>
