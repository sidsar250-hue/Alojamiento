{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | SysHSENA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="fs-1" style="color: var(--primary-teal);"><i class="bi bi-building-check"></i></div>
      <h3 class="section-title mb-1">SysHSENA</h3>
      <p class="text-muted small mb-0">Gestión de Alojamientos y Turismo • La Guajira</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'danger' }} py-2 small">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Usuario</label>
        <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Contraseña</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-teal w-100 py-2 mb-3">Ingresar al Sistema</button>
    </form>

    <div class="text-center small">
      <p class="mb-1">¿Eres turista o huésped? <a href="{% url 'registro_cliente' %}" class="fw-semibold" style="color: var(--primary-teal);">Crea tu cuenta aquí</a></p>
      <a href="{% url 'inicio_publico' %}" class="text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> Volver al portal turístico</a>
    </div>
  </div>
</body>
</html>
